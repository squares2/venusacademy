<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#C9A84C" />
  <meta name="description" content="Venus Gym — Professional Gym Management System" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Venus Gym" />

  <title>Venus Gym</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icon-192.webp" type="image/webp" />
  <link rel="apple-touch-icon" href="assets/icon-192.webp" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/auth.css" />
  <link rel="stylesheet" href="styles/modals.css" />
  <link rel="stylesheet" href="styles/modules.css" />

  <!-- App version (single source: version.js) -->
  <script src="version.js"></script>
  <style>
    .ver-pill {
      display: inline-flex; align-items: center; gap: 6px;
      height: 38px; padding: 0 10px; border-radius: var(--radius-md);
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      color: var(--text-muted); font-size: 12px; font-weight: 700;
      cursor: pointer; white-space: nowrap; transition: all var(--transition);
    }
    .ver-pill:hover { border-color: var(--border-default); color: var(--text-secondary); }
    .ver-pill.is-outdated { color: #1a1a1a; background: var(--warning, #f59e0b); border-color: var(--warning, #f59e0b); animation: verPulse 1.6s ease-in-out infinite; }
    @keyframes verPulse { 50% { box-shadow: 0 0 0 4px rgba(245,158,11,.25); } }
    @media (max-width: 620px) { .ver-pill { height: 32px; padding: 0 8px; font-size: 11px; } }

    .ver-banner {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      z-index: 10000; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center;
      max-width: calc(100% - 24px); padding: 12px 16px; border-radius: 12px;
      background: #1f1a0e; border: 1px solid var(--warning, #f59e0b); color: #fde68a;
      box-shadow: 0 10px 30px rgba(0,0,0,.45); font-size: 13.5px; font-weight: 600;
    }
    .ver-banner button {
      border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer;
      background: var(--warning, #f59e0b); color: #1a1a1a; font-weight: 800; font-size: 13px;
    }
    .ver-banner button:disabled { opacity: .6; cursor: wait; }
  </style>
</head>

<body>

  <!-- ═══════════════════════════════════════════
       AUTH SCREEN — Login
  ═══════════════════════════════════════════ -->
  <div id="auth-screen">
    <div class="auth-screen">

      <div class="auth-card">

        <!-- Logo -->
        <div class="auth-logo">
          <img src="assets/icon-192.webp" class="auth-logo-icon" alt="Venus" style="width:72px;height:72px;border-radius:50%;object-fit:cover;display:block;margin:0 auto;">
          <div class="auth-logo-name">VENUS</div>
          <div class="auth-logo-sub">GYM MANAGEMENT</div>
        </div>

        <!-- Error message -->
        <div class="auth-error" id="auth-error"></div>

        <!-- Login Form -->
        <form id="login-form" autocomplete="on">

          <div class="form-group">
            <label class="form-label" for="login-email" id="label-email">Email Address</label>
            <div class="input-icon-wrap">
              <span class="input-icon">✉</span>
              <input
                class="form-input"
                id="login-email"
                name="email"
                type="email"
                autocomplete="username"
                placeholder="you@example.com"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password" id="label-password">Password</label>
            <div class="input-icon-wrap">
              <span class="input-icon">🔒</span>
              <input
                class="form-input"
                id="login-password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="••••••••"
                required
              />
              <span class="input-toggle" id="pw-toggle" title="Show/hide password">👁</span>
            </div>
          </div>

          <button class="auth-submit" type="submit" id="login-btn">
            Sign In to Venus
          </button>

        </form>

        <!-- PWA install (shown only when the browser allows installing) -->
        <button type="button" class="pwa-install-btn pwa-install-login" data-pwa-install hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M5 21h14"/></svg><span class="pwa-install-label">Install Venus App</span>
        </button>

        <!-- Language toggle inside login card -->
        <div class="auth-footer">
          <button
            id="lang-toggle-btn"
            class="lang-toggle"
            style="margin: 0 auto; display:inline-flex;"
            type="button"
          >
            🌐 ع
          </button>
          <br />
          <span style="margin-top:8px;display:block">
            Venus Gym © <span id="footer-year"></span> · <span data-app-version></span>
          </span>
        </div>

      </div><!-- /auth-card -->

    </div><!-- /auth-screen -->
  </div><!-- /#auth-screen -->


  <!-- ═══════════════════════════════════════════
       APP SHELL — Sidebar + Topbar + Content
  ═══════════════════════════════════════════ -->
  <div id="app-shell" class="hidden">
    <div id="app">

      <!-- ── Sidebar ── -->
      <aside class="sidebar" id="sidebar">

        <!-- Logo -->
        <div class="sidebar-logo">
          <img src="assets/icon-192.webp" class="logo-icon" alt="Venus" style="border-radius:50%;width:38px;height:38px;object-fit:cover;">
          <span class="logo-text">VENUS</span>
        </div>

        <!-- Collapse toggle (desktop) -->
        <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar">‹</button>

        <!-- Navigation -->
        <nav class="sidebar-nav" id="sidebar-nav">
          <!-- Rendered by app.js → renderSidebar() -->
        </nav>

        <!-- User footer -->
        <div class="sidebar-footer">
          <div class="sidebar-user" onclick="App.logout()">
            <div class="user-avatar" id="sidebar-user-avatar">?</div>
            <div class="user-info">
              <div class="user-name" id="sidebar-user-name">—</div>
              <div class="user-role" id="sidebar-user-role">—</div>
            </div>
          </div>
        </div>

      </aside><!-- /sidebar -->

      <!-- Mobile overlay -->
      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <!-- ── Main Content ── -->
      <div class="main-content">

        <!-- Topbar -->
        <header class="topbar">

          <!-- Mobile hamburger -->
          <button class="topbar-btn" id="mobile-menu-btn" title="Open menu">☰</button>

          <!-- Page title -->
          <h2 class="topbar-page-title" id="topbar-page-title">Dashboard</h2>

          <!-- Topbar actions -->
          <div class="topbar-actions">

            <!-- App version — tap to check / force the latest update -->
            <button type="button" class="ver-pill" id="ver-pill" title="App version">
              <span data-app-version></span>
            </button>

            <!-- Connection status (NetGuard) -->
            <button type="button" class="ng-pill ng-pill-online" id="ng-pill" data-ng="pill">
              <span class="ng-dot"></span><span class="ng-pill-label">Online</span>
            </button>

            <!-- PWA install (shown only when the browser allows installing) -->
            <button type="button" class="pwa-install-btn pwa-install-top" data-pwa-install hidden title="Install App">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M5 21h14"/></svg><span class="pwa-install-label">Install App</span>
            </button>

            <!-- Language toggle -->
            <button
              class="lang-toggle"
              id="lang-toggle-btn"
              type="button"
              title="Switch language"
            >
              🌐 ع
            </button>

            <!-- Notifications (placeholder) -->
            <button class="topbar-btn" title="Notifications" id="notif-btn">
              🔔
              <span class="badge" id="notif-badge" style="display:none">0</span>
            </button>

            <!-- Logout -->
            <button
              class="topbar-btn"
              title="Sign out"
              onclick="App.logout()"
              style="font-size:15px;font-weight:700;letter-spacing:0px"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
            </button>

          </div>
        </header><!-- /topbar -->

        <!-- Page Content — rendered by router -->
        <main class="page-content" id="page-content">
          <div class="page-loader">
            <div class="spinner"></div>
            <span>Loading…</span>
          </div>
        </main>

      </div><!-- /main-content -->

    </div><!-- /#app -->
  </div><!-- /#app-shell -->


  <!-- ── Toast Container ── -->
  <div id="toast-container"></div>


  <!-- ═══════════════════════════════════════════
       FIREBASE SDK (compat v9)
  ═══════════════════════════════════════════ -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Chart.js (used by Reports) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- ═══════════════════════════════════════════
       APP SCRIPTS — load order matters
  ═══════════════════════════════════════════ -->
  <script src="scripts/firebase-config.js"></script>
  <script src="scripts/utils.js"></script>
  <script src="scripts/phone.js"></script>
  <script src="scripts/netguard.js"></script>
  <script src="scripts/subscribers.js"></script>
  <script src="scripts/modules-a.js"></script>
  <script src="scripts/modules-b.js"></script>
  <script src="scripts/course.js"></script>
  <script src="scripts/backup.js"></script>
  <script src="scripts/whatsapp.js"></script>
  <script src="scripts/app.js"></script>

  <!-- ── Minor inline inits ── -->
  <script>
    // Footer year
    document.getElementById('footer-year').textContent = new Date().getFullYear();

    // PWA service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
      });
    }

    // ── App version badge + "newer update on the server?" check ─────────
    (function () {
      const LOCAL = Number(self.APP_VERSION) || 0;
      const isAr = () => document.body.classList.contains('lang-ar');
      const txt = {
        badge:   v => 'v' + v,
        newer:   v => isAr() ? `يوجد تحديث جديد (v${v}) — أنت تعمل على v${LOCAL}` : `New update available (v${v}) — you are on v${LOCAL}`,
        update:  () => isAr() ? 'تحديث الآن' : 'Update now',
        working: () => isAr() ? 'جاري التحديث…' : 'Updating…',
        latest:  () => isAr() ? `أنت على آخر إصدار (v${LOCAL})` : `You are on the latest version (v${LOCAL})`,
        offline: () => isAr() ? 'لا يمكن التحقق من التحديث الآن (الاتصال ضعيف)' : "Couldn't check for updates right now (weak connection)",
      };
      document.querySelectorAll('[data-app-version]').forEach(el => el.textContent = txt.badge(LOCAL));

      const AUTO_KEY = 'venus_ver_autoreload';
      let remote = 0, banner = null, updating = false;

      // Ask the server which version is live (bypasses the service worker + browser cache)
      async function fetchRemote() {
        const r = await fetch('version.js?vcheck=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const m = (await r.text()).match(/APP_VERSION\s*=\s*(\d+)/);
        if (!m) throw new Error('no version');
        return Number(m[1]);
      }

      // Safe moment to reload by itself: still on the login screen, or just opened with no dialog open
      function safeToAutoReload() {
        const shell = document.getElementById('app-shell');
        const onLogin = shell && shell.classList.contains('hidden');
        const justOpened = performance.now() < 20000 && !document.querySelector('.open[id^="modal"], .modal-overlay.open');
        return onLogin || justOpened;
      }

      async function applyUpdate() {
        if (updating) return; updating = true;
        const btn = banner && banner.querySelector('button');
        if (btn) { btn.disabled = true; btn.textContent = txt.working(); }
        try {
          if ('serviceWorker' in navigator) {
            const reg = await navigator.serviceWorker.getRegistration();
            if (reg) await reg.update().catch(() => {});
          }
          if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.filter(k => k.startsWith('venus-gym-')).map(k => caches.delete(k)));
          }
        } catch (e) { /* reload anyway */ }
        location.reload();
      }

      function showBanner() {
        if (!banner) {
          banner = document.createElement('div');
          banner.className = 'ver-banner';
          banner.innerHTML = '<span></span><button type="button"></button>';
          banner.querySelector('button').addEventListener('click', applyUpdate);
          document.body.appendChild(banner);
        }
        banner.querySelector('span').textContent = txt.newer(remote);
        if (!updating) banner.querySelector('button').textContent = txt.update();
        const pill = document.getElementById('ver-pill');
        if (pill) { pill.classList.add('is-outdated'); pill.title = txt.newer(remote); }
      }

      async function check(manual) {
        try {
          remote = await fetchRemote();
        } catch (e) {
          if (manual && typeof Toast !== "undefined") Toast.error(txt.offline());
          return;
        }
        if (remote > LOCAL) {
          // Reload by itself once per new version, only when nothing can be lost
          let tried = {}; try { tried = JSON.parse(sessionStorage.getItem(AUTO_KEY) || '{}'); } catch (e) {}
          if (!manual && !tried[remote] && safeToAutoReload()) {
            tried[remote] = 1; try { sessionStorage.setItem(AUTO_KEY, JSON.stringify(tried)); } catch (e) {}
            return applyUpdate();
          }
          showBanner();
          if (manual) applyUpdate();
        } else if (manual && typeof Toast !== "undefined") {
          Toast.success(txt.latest());
        }
      }

      const pill = document.getElementById('ver-pill');
      if (pill) pill.addEventListener('click', () => check(true));

      window.addEventListener('load', () => setTimeout(() => check(false), 1500));
      setInterval(() => check(false), 5 * 60 * 1000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) check(false); });
      window.addEventListener('online', () => check(false));
    })();

    // ── PWA install button ──────────────────────────────
    (function () {
      const isAr = () => document.body.classList.contains('lang-ar');
      const txt = {
        top:   () => isAr() ? 'تثبيت التطبيق' : 'Install App',
        login: () => isAr() ? 'تثبيت تطبيق Venus' : 'Install Venus App',
        iosTitle: () => isAr() ? 'تثبيت Venus على جهازك' : 'Install Venus on your device',
        iosBody:  () => isAr()
          ? 'اضغط زر المشاركة <b>⬆︎</b> في Safari، ثم اختر <b>«إضافة إلى الشاشة الرئيسية»</b>.'
          : 'Tap the Share button <b>⬆︎</b> in Safari, then choose <b>“Add to Home Screen”</b>.',
        ok: () => isAr() ? 'حسناً' : 'Got it',
      };
      const isStandalone = () =>
        window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      let deferred = null;

      const buttons = () => document.querySelectorAll('[data-pwa-install]');
      function refresh() {
        const show = !isStandalone() && (deferred || isIOS);
        buttons().forEach(b => {
          b.hidden = !show;
          const lbl = b.querySelector('.pwa-install-label');
          if (lbl) lbl.textContent = b.classList.contains('pwa-install-login') ? txt.login() : txt.top();
          b.title = txt.top();
        });
      }

      function showIOSHelp() {
        let ov = document.getElementById('pwa-ios-help');
        if (!ov) {
          ov = document.createElement('div');
          ov.id = 'pwa-ios-help';
          ov.className = 'pwa-help-overlay';
          ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) ov.classList.remove('open'); });
          document.body.appendChild(ov);
        }
        ov.innerHTML = `<div class="pwa-help-card">
            <img src="assets/icon-192.webp" alt="" class="pwa-help-icon">
            <div class="pwa-help-title">${txt.iosTitle()}</div>
            <div class="pwa-help-body">${txt.iosBody()}</div>
            <button type="button" class="pwa-help-ok" data-close>${txt.ok()}</button>
          </div>`;
        ov.classList.add('open');
      }

      window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();          // keep Chrome's mini-bar away; we show our own button
        deferred = e;
        refresh();
      });
      window.addEventListener('appinstalled', () => { deferred = null; refresh(); });

      document.addEventListener('click', async e => {
        const btn = e.target.closest('[data-pwa-install]');
        if (!btn) return;
        if (deferred) {
          deferred.prompt();
          try { await deferred.userChoice; } catch (_) {}
          deferred = null;           // a prompt can only be used once
          refresh();
        } else if (isIOS) {
          showIOSHelp();
        }
      });

      // Keep labels in the current language (body class flips on language switch)
      new MutationObserver(refresh).observe(document.body, { attributes: true, attributeFilter: ['class'] });
      refresh();
    })();
  </script>

</body>
</html>
